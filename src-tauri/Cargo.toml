[package]
name = "skill-zoo"
version = "0.3.59"
description = "Local GUI tool for managing Agent Skills"
authors = ["luochang212"]
license = "MIT"
edition = "2021"
# Matches the highest MSRV in Cargo.lock (currently tauri 2.12 / muda at
# 1.90; zip 9.0.5 needs 1.88). `rust-version` is advisory metadata that cargo
# does not enforce against dependencies, so a lower value would only mislead
# anyone deciding which toolchain to install.
rust-version = "1.90.0"

[lib]
name = "skill_zoo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
test-helpers = []
portable = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
dirs = "7.0"
reqwest = { version = "0.13", features = ["rustls", "json", "query", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process"] }
futures = "0.3"
thiserror = "2.0"

serde_yaml = "0.9"
url = "2.5"
regex = "1.12"
tempfile = "3"
zip = "9.0"
sha2 = "0.11"
notify = "8"
rand = "0.10"
urlencoding = "2.1"
arboard = { version = "3.6.1", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
unicode-width = "0.2"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
junction = "2.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"

[dev-dependencies]
mockito = "1"
